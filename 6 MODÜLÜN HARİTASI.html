            --text-main: #FFFFFF; --text-dim: rgba(255, 255, 255, 0.6); --border: rgba(255, 255, 255, 0.1);
            --design-a: #C026D3; --design-b: #00B4FF; --design-c: #FF33FF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }

        .nav-label { font-size: 11px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 15px; display: block; }
        .nav-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 5px; display: flex; align-items: center; gap: 12px; color: var(--text-dim); }
        .nav-item:hover, .nav-item.active { background: var(--card-bg); color: var(--text-main); }
        .nav-item i { width: 20px; font-size: 18px; text-align: center; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header-tabs { padding: 20px 40px 0; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; gap: 30px; }
        .tab-btn { padding: 15px 5px; cursor: pointer; color: var(--text-dim); font-weight: 600; position: relative; transition: 0.3s; }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--accent-cyan); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan); }
        .content-body { padding: 30px 40px; overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--accent-purple) transparent; }
        .content-body::-webkit-scrollbar { width: 8px; }
        .content-body::-webkit-scrollbar-thumb { background-color: var(--accent-purple); border-radius: 10px; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 32px; margin-bottom: 20px; }
        .badge { background: var(--accent-purple); padding: 4px 12px; border-radius: 20px; font-size: 12px; vertical-align: middle; margin-left: 10px; }
        .grid-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; margin-top: 25px; }
        .info-card { background: var(--card-bg); border: 1px solid var(--border); padding: 25px; border-radius: 16px; backdrop-filter: blur(10px); line-height: 1.6; transition: transform 0.3s, box-shadow 0.3s; }
        .info-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .info-card.full-width { grid-column: 1 / -1; }
        .info-card h3 { color: var(--accent-cyan); margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        ul { list-style: none; padding-left: 0; }
        li { margin-bottom: 10px; font-size: 14px; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
        li::before { content: "▸"; color: var(--accent-pink); font-weight: bold; margin-top: 2px; }
        .feature-list li::before { content: "✓"; color: var(--design-a); }
        .tech-list li::before { content: "⚙"; color: var(--design-b); }
        .comparison-section { margin: 40px 0; background: rgba(255,255,255,0.02); border-radius: 20px; padding: 30px; border: 1px solid var(--border); }
        .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin-bottom: 25px; color: var(--text-main); display: flex; align-items: center; gap: 12px; }
        .comparison-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 1200px) { .comparison-grid { grid-template-columns: 1fr; } }
        .comp-card { background: var(--card-bg); border-radius: 16px; padding: 25px; border: 2px solid transparent; transition: all 0.3s; }
        .comp-card.design-a { border-color: rgba(192, 38, 211, 0.3); }
        .comp-card.design-b { border-color: rgba(0, 180, 255, 0.3); }
        .comp-card.design-c { border-color: rgba(255, 51, 255, 0.3); }
        .comp-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.4); }
        .comp-header { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .comp-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
        .design-a .comp-badge { background: rgba(192, 38, 211, 0.2); color: #C026D3; }
        .design-b .comp-badge { background: rgba(0, 180, 255, 0.2); color: #00B4FF; }
        .design-c .comp-badge { background: rgba(255, 51, 255, 0.2); color: #FF33FF; }
        .comp-header h4 { font-size: 18px; margin: 0; }
        .comp-list { font-size: 13px; }
        .comp-list li { margin-bottom: 8px; padding-left: 5px; }
        .comp-list li i { color: var(--accent-cyan); margin-right: 8px; font-size: 12px; }
        .tech-comparison { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 1200px) { .tech-comparison { grid-template-columns: 1fr; } }
        .tech-col { background: var(--card-bg); border-radius: 12px; padding: 20px; }
        .tech-col h5 { font-size: 14px; margin-bottom: 15px; padding: 8px 15px; border-radius: 8px; display: inline-block; }
        .tech-header-a { background: rgba(192, 38, 211, 0.15); color: #C026D3; }
        .tech-header-b { background: rgba(0, 180, 255, 0.15); color: #00B4FF; }
        .tech-header-c { background: rgba(255, 51, 255, 0.15); color: #FF33FF; }
        .tech-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .tech-tag { background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 20px; font-size: 11px; color: var(--text-dim); border: 1px solid var(--border); }
        .color-palette-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        .color-swatches { display: flex; flex-wrap: wrap; gap: 10px; }

        .color-swatch:hover { transform: scale(1.1); z-index: 10; }
        .color-swatch span { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; white-space: nowrap; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; opacity: 0; transition: opacity 0.2s; }
        .color-swatch:hover span { opacity: 1; }
        .diff-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 1200px) { .diff-summary { grid-template-columns: 1fr; } }
        .diff-item { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .diff-label { background: linear-gradient(135deg, rgba(192,38,211,0.2), rgba(0,180,255,0.2)); padding: 12px 20px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--border); }
        .diff-content { padding: 20px; }
        .diff-content ul { font-size: 13px; }
        .diff-content li { margin-bottom: 8px; color: var(--text-dim); }
        .diff-content li::before { content: "→"; color: var(--accent-cyan); }
        .pdf-view-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px; 
            height: calc(100vh - 80px);
            min-height: 600px;
        }
        .pdf-column { 
            background: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 16px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            transition: transform 0.3s; 
            height: 100%;
        }
        .pdf-column:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .pdf-col-header { 
            background: rgba(0, 0, 0, 0.4); 
            padding: 18px; 
            text-align: center; 
            font-weight: bold; 
            font-family: 'Space Grotesk', sans-serif; 
            border-bottom: 1px solid var(--border); 
            font-size: 14px; 
            letter-spacing: 1px; 
            flex-shrink: 0;
        }
        .pdf-col-header.a { color: #C026D3; background: linear-gradient(135deg, rgba(192,38,211,0.1), rgba(0,0,0,0.4)); border-bottom: 2px solid rgba(192,38,211,0.3); }
        .pdf-col-header.b { color: #00B4FF; background: linear-gradient(135deg, rgba(0,180,255,0.1), rgba(0,0,0,0.4)); border-bottom: 2px solid rgba(0,180,255,0.3); }
        .pdf-col-header.c { color: #FF33FF; background: linear-gradient(135deg, rgba(255,51,255,0.1), rgba(0,0,0,0.4)); border-bottom: 2px solid rgba(255,51,255,0.3); }

        /* 9:16 Aspect Ratio Wrapper */
        .pdf-aspect-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 240%; /* Kusursuz uzun dikey format */
            background: #1a1a2e;
            overflow: hidden;
        }
        .pdf-aspect-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-scroll-area { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0; 
            scrollbar-width: thin; 
            scrollbar-color: var(--accent-purple) transparent; 
        }
        .pdf-scroll-area::-webkit-scrollbar { width: 6px; }
        .pdf-scroll-area::-webkit-scrollbar-thumb { background-color: var(--accent-purple); border-radius: 10px; }

        .pdf-notice { 
            padding: 15px; 
            background: rgba(255,255,255,0.05); 
            margin: 15px; 
            border-radius: 12px; 
            border-left: 4px solid var(--accent-cyan); 
            font-size: 12px; 
            color: var(--text-dim); 
        }
        .pdf-notice strong { color: var(--text-main); display: block; margin-bottom: 5px; font-size: 13px; }

        @media (max-width: 1400px) { 
            .pdf-view-container { grid-template-columns: 1fr; height: auto; }
            .pdf-column { max-width: 500px; margin: 0 auto; width: 100%; }
        }
        .design-detail-container { animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .design-header { display: flex; align-items: center; justify-content: space-between; padding: 25px 30px; border-radius: 16px; margin-bottom: 30px; border: 1px solid var(--border); }
        .design-header.design-a { background: linear-gradient(135deg, rgba(192,38,211,0.1), rgba(0,0,0,0.3)); border-color: rgba(192,38,211,0.3); }
        .design-header.design-b { background: linear-gradient(135deg, rgba(0,180,255,0.1), rgba(0,0,0,0.3)); border-color: rgba(0,180,255,0.3); }
        .design-header.design-c { background: linear-gradient(135deg, rgba(255,51,255,0.1), rgba(0,0,0,0.3)); border-color: rgba(255,51,255,0.3); }
        .design-header h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; }
        .design-badge { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; font-family: 'Space Grotesk', sans-serif; }
        .design-a .design-badge { background: rgba(192,38,211,0.2); color: #C026D3; border: 2px solid #C026D3; }
        .design-b .design-badge { background: rgba(0,180,255,0.2); color: #00B4FF; border: 2px solid #00B4FF; }
        .design-c .design-badge { background: rgba(255,51,255,0.2); color: #FF33FF; border: 2px solid #FF33FF; }
        .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .color-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
        .color-preview { width: 40px; height: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); flex-shrink: 0; }
        .color-item span { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        @media (max-width: 768px) { .sidebar { width: 100%; position: fixed; bottom: 0; z-index: 1000; height: auto; flex-direction: row; padding: 10px; } .main-content { margin-bottom: 70px; } .content-body { padding: 20px; } .grid-info { grid-template-columns: 1fr; } .pdf-view-container { grid-template-columns: 1fr; height: auto; } .header-tabs { overflow-x: auto; gap: 15px; padding: 15px 20px 0; } }
    </style>
</head>

        let currentModule = 'adimsayar';

        function switchModule(moduleID) {
            currentModule = moduleID;
            currentTab = 0;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === 0);
            });
            updateUI();
        }

        function switchTab(index) {
            currentTab = index;
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            updateUI();
        }

        function updateUI() {
            const container = document.getElementById('dynamic-content');
            const data = modulesData[currentModule];

            if (currentTab === 4) {
                container.innerHTML = generatePDFView(currentModule);
            } else if (currentTab === 3) {
                container.innerHTML = generateComparisonView(data);
            } else {
                const designLetter = ['A', 'B', 'C'][currentTab];
                container.innerHTML = generateDesignDetail(data, designLetter);
            }
        }

        function generateDesignDetail(data, designLetter) {

            // Tüm özellikleri göster (slice kaldırıldı)

                // Emoji/icon ekleme
                let icon = '✓';
                if (f.toLowerCase().includes('anim')) icon = '🎬';
                else if (f.toLowerCase().includes('modal')) icon = '🪟';
                else if (f.toLowerCase().includes('token') || f.toLowerCase().includes('coin')) icon = '🪙';
                else if (f.toLowerCase().includes('glass')) icon = '🪟';
                else if (f.toLowerCase().includes('gradient')) icon = '🌈';
                else if (f.toLowerCase().includes('premium')) icon = '👑';
                else if (f.toLowerCase().includes('3d') || f.toLowerCase().includes('carousel')) icon = '🎠';
                else if (f.toLowerCase().includes('chart') || f.toLowerCase().includes('grafik')) icon = '📊';
                else if (f.toLowerCase().includes('swipe') || f.toLowerCase().includes('drag')) icon = '👆';
                return `<li style="display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 14px; line-height: 1.5;"><span style="font-size: 16px; flex-shrink: 0;">${icon}</span><span>${f}</span></li>`;

                    techCategories['Tipografi'].push(t);

                        <div class="color-list">${colorsA}</div>

                            <strong>Psikolojik Etki:</strong> Lüks, yaratıcılık, mistisizm. Koyu arka plan üzerinde neon vurgularla modern ama gizemli atmosfer.
                        </div>
                    </div>

                    <div class="color-col">
                        <div class="color-col-header" style="background: linear-gradient(135deg, #00B4FF, #0066FF);">
                            <h4>Tasarım B</h4>
                            <span>Mavi-Cyan Eksenli</span>
                        </div>
                        <div class="color-list">${colorsB}</div>
                        <div class="color-psychology">
                            <strong>Psikolojik Etki:</strong> Güven, teknoloji, serinlik. Profesyonel ve kurumsal his veren, teknolojik yeterliliği vurgulayan palet.
                        </div>
                    </div>

                    <div class="color-col">
                        <div class="color-col-header" style="background: linear-gradient(135deg, #FF33FF, #CC00FF, #0066FF);">
                            <h4>Tasarım C</h4>
                            <span>Pembe-Mavi Gradyan</span>
                        </div>
                        <div class="color-list">${colorsC}</div>
                        <div class="color-psychology">
                            <strong>Psikolojik Etki:</strong> Enerji, tutku, dinamizm. Aurora efektleriyle derinlik kazanan, dikkat çekici ve canlı görsel deneyim.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tipografi & Animasyon Analizi -->
            <div class="comparison-section" style="background: rgba(255,255,255,0.02);">
                <h3 class="section-title"><i class="fas fa-font" style="color: var(--accent-purple);"></i> Tipografi & Hareket Dili</h3>
                <div class="typo-motion-grid">
                    <div class="tm-card">
                        <div class="tm-header" style="color: #C026D3;">Tasarım A</div>
                        <div class="tm-content">
                            <div class="tm-item"><strong>Font:</strong> ${data.A.tech.find(t => t.includes('Typography'))?.split(':')[1] || 'Inter, Orbitron'}</div>
                            <div class="tm-item"><strong>Ana Animasyon:</strong> Pulse Glow, Float</div>
                            <div class="tm-item"><strong>Geçişler:</strong> Standart fade/slide</div>
                            <div class="tm-item"><strong>Vurgu:</strong> Progress ring, Glow efektler</div>
                        </div>
                    </div>
                    <div class="tm-card">
                        <div class="tm-header" style="color: #00B4FF;">Tasarım B</div>
                        <div class="tm-content">
                            <div class="tm-item"><strong>Font:</strong> ${data.B.tech.find(t => t.includes('Typography'))?.split(':')[1] || 'Syne, Epilogue'}</div>
                            <div class="tm-item"><strong>Ana Animasyon:</strong> Sound Wave, DNA Paths</div>
                            <div class="tm-item"><strong>Geçişler:</strong> Cubic-bezier smooth</div>
                            <div class="tm-item"><strong>Vurgu:</strong> Floating indicators, Shimmer</div>
                        </div>
                    </div>
                    <div class="tm-card">
                        <div class="tm-header" style="color: #FF33FF;">Tasarım C</div>
                        <div class="tm-content">
                            <div class="tm-item"><strong>Font:</strong> ${data.C.tech.find(t => t.includes('Typography'))?.split(':')[1] || 'Inter, Orbitron, Playfair'}</div>
                            <div class="tm-item"><strong>Ana Animasyon:</strong> Particle Float, 3D Transform</div>
                            <div class="tm-item"><strong>Geçişler:</strong> Perspective, Scale transforms</div>
                            <div class="tm-item"><strong>Vurgu:</strong> Canvas interaktifler, Ripple</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Evrim Analizi (A→B→C) -->
            <div class="comparison-section">
                <h3 class="section-title"><i class="fas fa-code-branch" style="color: var(--accent-cyan);"></i> Tasarım Evrimi & Geçiş Analizi</h3>
                <div class="evolution-timeline">
                    <div class="evo-step">
                        <div class="evo-badge" style="background: linear-gradient(135deg, #C026D3, #FF00AA);">A</div>
                        <div class="evo-arrow"><i class="fas fa-arrow-right"></i></div>
                        <div class="evo-content">
                            <h4>Temelden Gelişmişe</h4>
                            <ul>
                                <li><strong>Görsel Derinlik:</strong> Düz arka plan → Gradient/Glassmorphism</li>
                                <li><strong>Navigasyon:</strong> Temel tab'ler → Screen-based routing</li>
                                <li><strong>Veri Gösterimi:</strong> Basit listeler → Card'lar ve Grid'ler</li>
                                <li><strong>Etkileşim:</strong> Button clicks → Swipe gestures</li>
                                <li><strong>Tipografi:</strong> Tek font ailesi → Display + Body ayrımı</li>
                            </ul>
                        </div>
                    </div>

                    <div class="evo-step">
                        <div class="evo-badge" style="background: linear-gradient(135deg, #00B4FF, #0066FF);">B</div>
                        <div class="evo-arrow"><i class="fas fa-arrow-right"></i></div>
                        <div class="evo-content">
                            <h4>Profesyonelden Premiuma</h4>
                            <ul>
                                <li><strong>Görsel Efektler:</strong> Blur → Aurora/Canvas animasyonlar</li>
                                <li><strong>Layout:</strong> Standart grid → Asimetrik/Masonry</li>
                                <li><strong>Mikro-etkileşimler:</strong> Hover states → Particle effects</li>
                                <li><strong>Derinlik:</strong> 2D planes → 3D perspective transforms</li>
                                <li><strong>Detay:</strong> Statik görseller → Ripple/Trail efektler</li>
                            </ul>
                        </div>
                    </div>

                    <div class="evo-step">
                        <div class="evo-badge" style="background: linear-gradient(135deg, #FF33FF, #CC00FF);">C</div>
                        <div class="evo-content final">
                            <h4>Son Aşama: İmersif Deneyim</h4>
                            <ul>
                                <li><strong>Teknoloji:</strong> CSS-only → Canvas/WebGL hazırlık</li>
                                <li><strong>Kullanıcı Kontrolü:</strong> Passif izleme → Aktif manipülasyon</li>
                                <li><strong>Hikaye Anlatımı:</strong> Bilgi sunumu → Deneyim tasarımı</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Yaratıcı Fikirler & Öne Çıkanlar -->
            <div class="comparison-section" style="background: linear-gradient(135deg, rgba(255,0,170,0.1), rgba(0,192,255,0.1)); border: 1px solid rgba(255,255,255,0.1);">
                <h3 class="section-title"><i class="fas fa-lightbulb" style="color: #FFD700;"></i> Yaratıcı Fikirler & Öne Çıkan Tasarım Unsurları</h3>
                <div class="creative-highlights">
                    <div class="ch-card">
                        <div class="ch-icon" style="background: linear-gradient(135deg, #FFD700, #FFA500);"><i class="fas fa-magic"></i></div>
                        <h4>En İyi Etkileşim</h4>
                        <div class="ch-winner" style="color: #FF33FF;">Tasarım C</div>
                        <p>Canvas bazlı su falı kasesi ve kristal küre interaktifleri. Kullanıcı dokunuşuna gerçek zamanlı tepki veren partikül sistemleri.</p>
                    </div>

                    <div class="ch-card">
                        <div class="ch-icon" style="background: linear-gradient(135deg, #00C0FF, #0066FF);"><i class="fas fa-eye"></i></div>
                        <h4>En İyi Görsel Hiyerarşi</h4>
                        <div class="ch-winner" style="color: #00B4FF;">Tasarım B</div>
                        <p>Syne ve Epilogue font kombinasyonu ile profesyonel bilgi mimarisi. Glassmorphism kartlarla derinlik hissi.</p>
                    </div>

                    <div class="ch-card">
                        <div class="ch-icon" style="background: linear-gradient(135deg, #C026D3, #FF00AA);"><i class="fas fa-bolt"></i></div>
                        <h4>En Verimli Performans</h4>
                        <div class="ch-winner" style="color: #C026D3;">Tasarım A</div>
                        <p>Minimal animasyon ve optimize edilmiş SVG'ler ile hızlı yükleme. Temiz kod yapısı ve düşük kaynak kullanımı.</p>
                    </div>

                    <div class="ch-card">
                        <div class="ch-icon" style="background: linear-gradient(135deg, #FF33FF, #CC00FF);"><i class="fas fa-crown"></i></div>
                        <h4>En Premium Hissiyat</h4>
                        <div class="ch-winner" style="color: #FF33FF;">Tasarım C</div>
                        <p>3D carousel, VIP gradient ring'ler ve aurora arka planlar. Kullanıcıya "özel" hissettiren detaylar.</p>
                    </div>
                </div>
            </div>

            <!-- Genel Özet -->
            <div class="comparison-section" style="margin-top: 30px;">
                <div class="final-verdict">
                    <h3><i class="fas fa-balance-scale"></i> Genel Değerlendirme</h3>
                    <div class="verdict-grid">
                        <div class="verdict-item">
                            <strong style="color: #C026D3;">Tasarım A</strong>
                            <span>MVPhızlı geliştirme, temel kullanıcı ihtiyaçları, düşük cihaz gereksinimi</span>
                        </div>
                        <div class="verdict-item">
                            <strong style="color: #00B4FF;">Tasarım B</strong>
                            <span>Profesyonel ürün, geniş kitleye hitap, dengeli özellik/yük dengesi</span>
                        </div>
                        <div class="verdict-item">
                            <strong style="color: #FF33FF;">Tasarım C</strong>
                            <span>Flagship deneyim, premium kullanıcılar, maksimum görsel etki</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Gerekli CSS eklentileri -->
            <style>
                .design-approach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
                @media (max-width: 1200px) { .design-approach-grid { grid-template-columns: 1fr; } }

                .approach-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); transition: transform 0.3s; }
                .approach-card:hover { transform: translateY(-5px); }
                .approach-header { display: flex; align-items: center; gap: 15px; padding: 20px; background: rgba(0,0,0,0.2); }
                .approach-letter { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
                .design-a-card .approach-letter { background: rgba(192,38,211,0.2); color: #C026D3; }
                .design-b-card .approach-letter { background: rgba(0,180,255,0.2); color: #00B4FF; }
                .design-c-card .approach-letter { background: rgba(255,51,255,0.2); color: #FF33FF; }
                .approach-title h4 { margin: 0; font-size: 16px; }
                .approach-sub { font-size: 12px; color: var(--text-dim); }
                .approach-body { padding: 20px; }
                .approach-visuals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
                .viz-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); opacity: 0.4; transition: 0.3s; }
                .viz-item.active { opacity: 1; color: var(--text-main); }
                .viz-item i { font-size: 14px; }
                .approach-desc { font-size: 13px; line-height: 1.6; color: var(--text-dim); }

                .color-analysis-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
                @media (max-width: 1200px) { .color-analysis-grid { grid-template-columns: 1fr; } }
                .color-col { background: var(--card-bg); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); }
                .color-col-header { padding: 20px; color: white; }
                .color-col-header h4 { margin: 0 0 5px 0; }
                .color-col-header span { font-size: 12px; opacity: 0.9; }
                .color-list { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
                .color-detail-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; }
                .color-swatch-large { width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0; }
                .color-info { display: flex; flex-direction: column; }
                .color-info strong { font-size: 13px; margin-bottom: 2px; }
                .color-info code { font-size: 11px; color: var(--text-dim); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; }
                .color-info small { font-size: 10px; color: var(--text-dim); opacity: 0.8; }
                .color-psychology { padding: 15px 20px; background: rgba(0,0,0,0.2); font-size: 13px; line-height: 1.5; border-top: 1px solid var(--border); }

                .typo-motion-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
                @media (max-width: 1200px) { .typo-motion-grid { grid-template-columns: 1fr; } }
                .tm-card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
                .tm-header { font-size: 18px; font-weight: 700; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
                .tm-item { margin-bottom: 10px; font-size: 13px; color: var(--text-dim); }
                .tm-item strong { color: var(--text-main); }

                .evolution-timeline { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
                .evo-step { display: flex; align-items: flex-start; gap: 20px; background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border); }
                .evo-badge { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; color: white; flex-shrink: 0; }
                .evo-arrow { color: var(--text-dim); font-size: 20px; margin-top: 15px; }
                .evo-content { flex: 1; }
                .evo-content h4 { margin: 0 0 12px 0; color: var(--text-main); }
                .evo-content ul { margin: 0; padding-left: 0; list-style: none; }
                .evo-content li { margin-bottom: 8px; font-size: 14px; color: var(--text-dim); padding-left: 20px; position: relative; }
                .evo-content li:before { content: "→"; position: absolute; left: 0; color: var(--accent-cyan); }

                .creative-highlights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
                @media (max-width: 1200px) { .creative-highlights { grid-template-columns: repeat(2, 1fr); } }
                @media (max-width: 768px) { .creative-highlights { grid-template-columns: 1fr; } }
                .ch-card { background: var(--card-bg); border-radius: 16px; padding: 25px; text-align: center; border: 1px solid var(--border); transition: transform 0.3s; }
                .ch-card:hover { transform: translateY(-5px); }
                .ch-icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; }
                .ch-card h4 { margin: 0 0 8px 0; font-size: 14px; color: var(--text-main); }
                .ch-winner { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
                .ch-card p { font-size: 13px; color: var(--text-dim); line-height: 1.5; margin: 0; }

                .final-verdict { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 16px; }
                .final-verdict h3 { margin: 0 0 20px 0; display: flex; align-items: center; gap: 10px; }
                .verdict-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
                @media (max-width: 900px) { .verdict-grid { grid-template-columns: 1fr; } }
                .verdict-item { display: flex; flex-direction: column; gap: 8px; }
                .verdict-item strong { font-size: 16px; }
                .verdict-item span { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
            </style>`;
        }

        function generatePDFView(module) {
            const links = pdfLinks[module];
            return `<h1>${modulesData[module].title} <span class="badge" style="background:var(--bg); border: 1px solid var(--border)">PDF Önizleme</span></h1>
            <div class="pdf-view-container">
                <div class="pdf-column">
                    <div class="pdf-col-header a">TASARIM A</div>
                    <div class="pdf-scroll-area">
                        <div class="pdf-aspect-wrapper">
                            <iframe src="${links.A}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
                <div class="pdf-column">
                    <div class="pdf-col-header b">TASARIM B</div>
                    <div class="pdf-scroll-area">
                        <div class="pdf-aspect-wrapper">
                            <iframe src="${links.B}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
                <div class="pdf-column">
                    <div class="pdf-col-header c">TASARIM C</div>
                    <div class="pdf-scroll-area">
                        <div class="pdf-aspect-wrapper">
                            <iframe src="${links.C}" frameborder="0" allowfullscreen></iframe>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        window.onload = () => { updateUI(); };
    </script>
</body>
</html>
