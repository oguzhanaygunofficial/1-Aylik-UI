<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibella - iPhone 16 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@1,800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* iPhone 16 Pro Frame - Natural Titanium */
        .iphone-frame {
            width: 402px;
            height: 874px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 
                0 0 0 2px #3a3a3a,
                0 0 0 4px #1a1a1a,
                0 25px 80px rgba(0,0,0,0.6),
                0 50px 120px rgba(0,0,0,0.4),
                inset 0 0 30px rgba(255,255,255,0.03);
            position: relative;
        }

        /* Titanium Frame Shine */
        .iphone-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 55px;
            padding: 2px;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.4) 0%, 
                rgba(255,255,255,0.1) 30%,
                rgba(255,255,255,0.05) 50%,
                rgba(255,255,255,0.1) 70%, 
                rgba(255,255,255,0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Side Buttons */
        .side-btn {
            position: absolute;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 100%);
            border-radius: 2px;
        }
        .volume-up { width: 3px; height: 35px; left: -3px; top: 120px; }
        .volume-down { width: 3px; height: 35px; left: -3px; top: 165px; }
        .action-btn { width: 3px; height: 50px; left: -3px; top: 220px; }
        .power-btn { width: 3px; height: 60px; right: -3px; top: 150px; }

        /* Screen */
        .screen {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 47px;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 37px;
            background: #0a0a0a;
            border-radius: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow:
                0 0 0 1.5px rgba(255,255,255,0.06),
                0 4px 16px rgba(0,0,0,0.9),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .island-cam {
            width: 10px;
            height: 10px;
            background: radial-gradient(circle at 35% 35%, #1c2a3a 0%, #050505 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 3px rgba(255,255,255,0.25), 0 0 4px rgba(0,150,255,0.15);
        }
        .island-time {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        /* App Content - Fixed Layout */
        .app {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            position: relative;
            display: flex;
            flex-direction: column;
            padding-top: 60px; /* Space for Dynamic Island */
            overflow: hidden; /* TAŞMAYI ENGELLE */
            border-radius: 47px;
        }

        .app::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px; /* bottom nav'dan biraz fazla */
    background: #0a0a0f; /* bottom nav ile aynı renk */
    pointer-events: none; /* tıklamaya engel olma */
    z-index: 999; /* content üstünde, bottom nav altında */
    border-radius: 0 0 43px 43px; /* köşeler uysun */
}

        /* Fixed Header - Below Dynamic Island */
        .header {
            padding: 8px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #0f0f14 0%, #0a0a0f 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            z-index: 100;
        }

        .discover-pill {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #000;
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 6px 14px;
        }

        /* Montserrat Black for KEŞFET */
        .discover-text {
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            transform: skewX(-6deg);
            display: inline-block;
            background: linear-gradient(90deg, #45D3D0 0%, #8E82E6 50%, #F07BB0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(142,130,230,0.5));
        }

        .header-btns {
            display: flex;
            gap: 8px;
        }

        .h-btn {
            width: 38px;
            height: 38px;
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            transition: transform 0.2s;
        }
        .h-btn.plus-btn {
    border: 1.5px solid rgba(255,255,255,0.25);
    background: linear-gradient(135deg, #2d2d30 0%, #1c1c1e 100%);
    width: 38px;
    height: 38px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    transition: transform 0.2s;
}

.h-btn.plus-btn:active { 
    transform: scale(0.95); 
}

.h-btn.plus-btn i {
    background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 16px;
    filter: drop-shadow(0 0 6px rgba(168,85,247,0.5));
}

        /* Event Button */
        .h-btn.event {
            background: linear-gradient(135deg, #ff006e 0%, #8338ec 50%, #3a86ff 100%);
            border: 1.5px solid rgba(255,255,255,0.4);
            box-shadow: 
                0 0 20px rgba(131,56,236,0.6), 
                0 0 40px rgba(131,56,236,0.4),
                inset 0 0 15px rgba(255,255,255,0.2);
            position: relative;
        }
        .h-btn.event::before {
            content: '';
            position: absolute;
            inset: 0;
            background: inherit;
            filter: blur(12px);
            opacity: 0.7;
            z-index: -1;
            border-radius: 14px;
            transform: scale(1.1);
        }
        .h-btn.event i {
            color: #fff;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.6));
            animation: swing 3s ease-in-out infinite;
        }
        @keyframes swing {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Message Button */
        .h-btn.msg {
            border: 1.5px solid rgba(255,255,255,0.25);
            background: linear-gradient(135deg, #2d2d30 0%, #1c1c1e 100%);
        }
        .h-btn.msg i {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(59,130,246,0.8));
        }

        /* Notification Button */
        .h-btn.notif {
            border: 1.5px solid rgba(255,255,255,0.25);
            background: linear-gradient(135deg, #2d2d30 0%, #1c1c1e 100%);
            position: relative;
        }
        .h-btn.notif i {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 50%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(236,72,153,0.8));
        }
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ff375f;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #000;
        }

        /* Stories - Scrolls with content */
        .stories-wrap {
            background: linear-gradient(180deg, #0a0a0f 0%, #050508 100%);
        }
        .stories {
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
        }
        .stories::-webkit-scrollbar { display: none; }

        .story {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .story-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #6d28d9 100%);
            padding: 2.5px;
            position: relative;
            cursor: pointer;
        }
        .story-avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #000;
            overflow: hidden;
            position: relative;
        }
        .story-avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* Fixed add button - positioned outside */
        .add-btn {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2.5px solid #000;
            color: #fff;
            font-size: 12px;
            z-index: 10;
        }
        .story span {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* Scrollable Content Area */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 0 0 100px;
            background: #050508;
        }
        .content::-webkit-scrollbar { display: none; }
        .content .stories-wrap {
            padding: 0;
            margin-bottom: 4px;
        }
        .content-posts {
            padding: 0 16px;
        }

        /* Post */
        .post {
            background: linear-gradient(135deg, rgba(124,58,237,0.15) 0%, rgba(0,0,0,0) 50%, rgba(6,182,212,0.1) 100%);
            padding: 1.5px;
            border-radius: 24px;
            margin-bottom: 20px;
        }
        .post-inner {
            background: #0d0d12;
            border-radius: 22.5px;
            overflow: hidden;
        }
        .post-header {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .post-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #7c3aed;
        }
        .post-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-info h3 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }
        .post-info p {
            font-size: 14px;
            color: #6b7280;
        }
        .post-menu {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #1c1c1e;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
        }
        .post-tags {
            padding: 0 16px 12px;
            font-size: 15px;
            color: #fff;
        }
        .post-img {
            width: 100%;
            aspect-ratio: 3/4;
            overflow: hidden;
            background: #1a1a1a;
        }
        .post-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

       /* Fixed Bottom Nav */
.bottom-nav {
    position: absolute;
    bottom: -4px;
    left: 0px;
    right: 0px;
    width: auto;
    background: rgba(10, 10, 15, 0.98);
    padding: 8px 12px 30px;
    height: 85px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    place-items: center;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 0 0 39px 39px;
    z-index: 1000;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    margin: 0;
    box-sizing: border-box;
}

/* Genel Nav Buton Stili */
.nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
}

.nav-btn i {
    font-size: 20px;
    color: #9ca3af;
    transition: all 0.2s ease;
}

/* Aktif Durum - Mor Işıltı */
.nav-btn.active {
    background: rgba(139, 92, 246, 0.2);
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
}

.nav-btn.active i {
    color: #a855f7;
    filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.8));
}

/* ============================================
   REELS BUTONU - Yuvarlak Play İkonu
   ============================================ */
.reels-btn i {
    font-size: 23px;
    color: #9ca3af;
}

.nav-btn.reels-btn.active i {
    color: #a855f7;
    filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.9));
}

/* ============================================
   VIDEO KAYIT BUTONU - Özel Renk Geçişi
   ============================================ */
.video-record-btn i {
    background: linear-gradient(135deg, 
        #00f5ff 0%,
        #00d4ff 15%,
        #7b2cbf 45%,
        #9d4edd 60%,
        #ff006e 85%,
        #ff4d9e 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 8px rgba(0, 245, 255, 0.4)) 
            drop-shadow(0 0 12px rgba(255, 0, 110, 0.3));
    font-size: 24px;
}

/* Video butonu aktif - parlama artar */
.nav-btn.video-record-btn.active i {
    filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.7)) 
            drop-shadow(0 0 25px rgba(255, 0, 110, 0.6))
            drop-shadow(0 0 35px rgba(123, 44, 191, 0.5));
}

/* Video butonu hover */
.nav-btn.video-record-btn:hover i {
    filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.8)) 
            drop-shadow(0 0 30px rgba(255, 0, 110, 0.7));
    transform: scale(1.15);
}

        /* Post Actions Bar */
        .post-actions {
            padding: 12px 16px 16px;
            display: flex;
            align-items: center;
            gap: 0;
        }
        .post-date {
            font-size: 12px;
            color: #4b5563;
            font-weight: 500;
            margin-left: auto;
            letter-spacing: 0.2px;
        }
        .action-btns {
            display: flex;
            align-items: center;
            gap: 4px;
            order: -1;
        }
        .act-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            position: relative;
        }
        .act-btn:active { transform: scale(0.88); }
        .act-btn i {
            font-size: 17px;
            transition: color 0.2s, filter 0.2s;
        }
        .act-btn.like i {
            color: #f43f5e;
            filter: drop-shadow(0 0 5px rgba(244,63,94,0.65));
        }
        .act-btn.like.liked i {
            color: #f43f5e;
            filter: drop-shadow(0 0 8px rgba(244,63,94,0.9));
        }
        .act-btn.comment i {
            color: #60a5fa;
            filter: drop-shadow(0 0 5px rgba(96,165,250,0.65));
        }
        .act-btn.share i {
            color: #34d399;
            filter: drop-shadow(0 0 5px rgba(52,211,153,0.65));
        }
        .act-btn.save i {
            color: #a855f7;
            filter: drop-shadow(0 0 5px rgba(168,85,247,0.65));
        }
        .act-btn.save.saved i {
            color: #a855f7;
            filter: drop-shadow(0 0 8px rgba(168,85,247,0.9));
        }
        .act-count {
            font-size: 11px;
            color: #6b7280;
            font-weight: 600;
            min-width: 20px;
            text-align: left;
            margin-left: -2px;
            margin-right: 6px;
        }

/* ============================================
   CREATE TAB MODAL - iPhone Frame İçinde
   ============================================ */

.create-tab-overlay {
    position: absolute;      /* FIXED yerine ABSOLUTE - iPhone içinde */
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    border-radius: 47px;     /* Screen ile aynı border-radius */
    overflow: hidden;         /* iPhone köşelerine uysun */
}

.create-tab-overlay.open {
    opacity: 1;
    pointer-events: all;
}

/* Blurlu Arka Plan - Mor/Turkuaz Tonları */
.create-tab-backdrop {
    position: absolute;
    inset: 0;
    background: 
        radial-gradient(circle at 20% 30%, rgba(139, 92, 246, 0.4) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(69, 211, 208, 0.3) 0%, transparent 50%),
        rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(25px) saturate(200%);
    -webkit-backdrop-filter: blur(25px) saturate(200%);
}

/* Modal Container - iPhone Frame'e Uygun */
.create-tab-modal {
    position: relative;
    width: 100%;
    height: 85%;              /* Ekranın %85'i kadar */
    max-height: 600px;
    background: linear-gradient(180deg, 
        rgba(26, 26, 46, 0.98) 0%, 
        rgba(15, 15, 26, 0.98) 50%,
        rgba(10, 10, 18, 0.98) 100%
    );
    border-radius: 32px 32px 0 0;
    padding: 24px 20px 40px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
    
    /* Gradyan Border - Mor/Turkuaz */
    border: 1px solid transparent;
    background-clip: padding-box;
    position: relative;
}

/* Gradyan Border Efekti */
.create-tab-modal::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 32px 32px 0 0;
    padding: 1px;
    background: linear-gradient(180deg, 
        rgba(139, 92, 246, 0.6) 0%, 
        rgba(69, 211, 208, 0.4) 50%,
        transparent 100%
    );
    -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

/* İç Glow Efekti */
.create-tab-modal::after {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    right: 10%;
    height: 1px;
    background: linear-gradient(90deg, 
        transparent 0%,
        rgba(139, 92, 246, 0.8) 20%,
        rgba(69, 211, 208, 0.8) 50%,
        rgba(139, 92, 246, 0.8) 80%,
        transparent 100%
    );
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
}

.create-tab-overlay.open .create-tab-modal {
    transform: translateY(0);
}

/* Sürükleme Çubuğu - Turkuaz/Mor Gradyan */
.create-tab-handle {
    width: 100%;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    margin-bottom: 12px;
}

.create-tab-handle:active {
    cursor: grabbing;
}

.handle-bar {
    width: 48px;
    height: 5px;
    background: linear-gradient(90deg, 
        rgba(139, 92, 246, 0.6) 0%,
        rgba(69, 211, 208, 0.8) 50%,
        rgba(139, 92, 246, 0.6) 100%
    );
    border-radius: 3px;
    transition: all 0.2s;
    box-shadow: 0 0 10px rgba(69, 211, 208, 0.3);
}

.create-tab-handle:hover .handle-bar {
    background: linear-gradient(90deg, 
        rgba(139, 92, 246, 0.9) 0%,
        rgba(69, 211, 208, 1) 50%,
        rgba(139, 92, 246, 0.9) 100%
    );
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
}

/* Header */
.create-tab-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    position: relative;
    z-index: 1;
}

/* Gradyan Başlık - Mor/Turkuaz */
.create-tab-title {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, 
        #fff 0%, 
        #a78bfa 30%,
        #45D3D0 70%,
        #fff 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    text-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
}

/* Çarpı Butonu - Gradyan Border */
.create-tab-close {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
    position: relative;
    display: flex;

/* Gradyan Border */

    content: '';
    position: absolute;

        rgba(139, 92, 246, 0.8) 0%, 
        rgba(69, 211, 208, 0.8) 100%
    );

        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
}

.create-tab-close:hover {

/* Grid */
.create-tab-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;

    z-index: 1;
}

/* Tab Item - Gradyan Border Hover */
.create-tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 28px 16px;
    background: rgba(255,255,255,0.02);

/* Hover'da Gradyan Border */
.create-tab-item::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1.5px;
    background: linear-gradient(135deg, 
        rgba(139, 92, 246, 0) 0%, 
        rgba(69, 211, 208, 0) 100%
    );

}

<script>

function setActiveNav(clickedBtn) {
    // Tüm nav butonlarından active class'ını kaldır
    document.querySelectorAll('.bottom-nav .nav-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    
    // Tıklanan butona active class'ı ekle
    clickedBtn.classList.add('active');
}

// Create Tab Aç/Kapat
function openCreateTab() {
    const overlay = document.getElementById('createTabOverlay');
    overlay.classList.add('open');
}

function closeCreateTab() {
    const overlay = document.getElementById('createTabOverlay');
    const modal = document.getElementById('createTabModal');
    
    overlay.classList.remove('open');
    
    // Modal pozisyonunu sıfırla
    setTimeout(() => {
        modal.style.transform = '';
        modal.style.transition = '';
    }, 300);
}

// Sürükleme (Swipe Down)
let startY = 0;
let currentY = 0;
let isDragging = false;

function startDrag(e) {
    isDragging = true;
    startY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    
    const modal = document.getElementById('createTabModal');
    modal.style.transition = 'none';
}

function drag(e) {
    if (!isDragging) return;
    
    currentY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
    const deltaY = currentY - startY;
    
    if (deltaY > 0) {
        const modal = document.getElementById('createTabModal');
        modal.style.transform = `translateY(${deltaY}px)`;
    }
}

function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    
    const modal = document.getElementById('createTabModal');
    const deltaY = currentY - startY;
    
    modal.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1)';
    
    if (deltaY > 80) {
        closeCreateTab();
    } else {
        modal.style.transform = '';
    }
}

// Event Listeners
document.addEventListener('mousemove', drag);
document.addEventListener('touchmove', drag, { passive: false });
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);
    
    // Reset
    svg.style.opacity = '1';
    circle.style.filter = 'drop-shadow(0 0 2px rgba(255,255,255,0.6))';
    circle.style.transition = 'none';
    
    function draw(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        // easeInOut
        const eased = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
        
        if (reverse) {
            // Ters: dolu çemberden boşa doğru (silme)
            circle.style.strokeDashoffset = eased * circumference;
        } else {
            // Normal: boştan dolu çembere doğru (çizme)
            circle.style.strokeDashoffset = circumference * (1 - eased);
        }

        if (progress < 1) {
            requestAnimationFrame(draw);
        } else {
            if (!reverse) {
                // Normal animasyonda parlama efekti
                circle.style.strokeDashoffset = 0;
                circle.style.filter = 'drop-shadow(0 0 4px white) drop-shadow(0 0 8px white) brightness(16)';
                circle.style.transition = 'filter 0.15s ease-in';
                setTimeout(() => {
                    svg.style.transition = 'opacity 0.2s ease-out';
                    svg.style.opacity = '0';
                }, 180);
            } else {
                // Ters animasyonda sadece fadeout
                circle.style.strokeDashoffset = circumference;
                svg.style.transition = 'opacity 0.15s ease-out';
                svg.style.opacity = '0';
            }
        }
    }
    requestAnimationFrame(draw);
    
</script>
